name: Environment drift

# The module repos change daily and these docs did not, which is how Librarian
# shipped a sign-in requirement the docs never mentioned. This reads each
# module's .env.example straight from its repo and fails when a variable is
# missing here.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/content/docs/modules/**'
      - 'scripts/check-env-drift.mjs'
      - '.github/workflows/env-drift.yml'
  # Upstream can drift without anything changing in this repo.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  env-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Compare documented environment variables against each repo
        run: node scripts/check-env-drift.mjs
